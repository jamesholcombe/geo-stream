name: Publish to npm

# Only triggered by CI (workflow_call after tests pass + tag created) or manually.
# Removing push:tags trigger intentionally — unprotected tags would otherwise
# allow anyone with push access to trigger a release without tests passing.
# To release: run `make bump-patch` (or bump-minor/bump-major) then `git push`.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1a. Build one .node binary per platform (standard, memory backend) ──────
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14           # Apple Silicon, native
          - target: x86_64-apple-darwin
            runner: macos-14           # arm64 runner, cross-compiles to x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm   # GitHub's native arm64 runner
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci
        working-directory: geo-stream

      - name: Build native module
        run: npm run build -- --target ${{ matrix.target }}
        working-directory: geo-stream

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: geo-stream/src/*.node
          if-no-files-found: error

  # ── 1b. Build one .node binary per platform (redis backend) ─────────────────
  build-redis:
    name: Build Redis (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          # Separate cache key so redis and standard builds don't evict each other.
          key: redis

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm ci
        working-directory: geo-stream-redis

      - name: Build native module (redis backend)
        run: npm run build -- --target ${{ matrix.target }}
        working-directory: geo-stream-redis

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-redis-${{ matrix.target }}
          path: geo-stream-redis/src/*.node
          if-no-files-found: error

  # ── 2. Collect all binaries, publish both packages to npm ───────────────────
  publish:
    name: Publish
    needs: [build, build-redis]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install JS deps (standard)
        run: npm ci
        working-directory: geo-stream

      - name: Install JS deps (redis)
        run: npm ci
        working-directory: geo-stream-redis

      # Download all standard artifacts into geo-stream/artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: geo-stream/artifacts
          merge-multiple: false

      # Download all redis artifacts into geo-stream-redis/artifacts/
      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-redis-*
          path: geo-stream-redis/artifacts
          merge-multiple: false

      # napi artifacts copies each *.node into the committed npm/<platform>/ stubs.
      - name: Organise artifacts (standard)
        run: npx napi artifacts --build-output-dir artifacts
        working-directory: geo-stream

      - name: Organise artifacts (redis)
        run: npx napi artifacts --build-output-dir artifacts
        working-directory: geo-stream-redis

      # Publish redis platform packages first (standard package has no dependency on them).
      - name: Pre-publish (redis platform packages)
        run: npx napi pre-publish -t npm --no-gh-release
        working-directory: geo-stream-redis
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publish standard platform packages.
      - name: Pre-publish (standard platform packages)
        run: npx napi pre-publish -t npm --no-gh-release
        working-directory: geo-stream
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Compile TypeScript for both packages.
      - name: Compile TypeScript (standard)
        run: npx tsc
        working-directory: geo-stream

      - name: Compile TypeScript (redis)
        run: npx tsc
        working-directory: geo-stream-redis

      # Publish redis root package.
      - name: Publish redis root package
        run: npm publish --access public
        working-directory: geo-stream-redis
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publish standard root package last.
      - name: Publish root package
        run: npm publish --access public
        working-directory: geo-stream
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          TAG="v$(cat version.txt | tr -d '[:space:]')"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
